name: Update profile stats

on:
  schedule:
    # Runs daily at 08:17 UTC.
    # The odd minute avoids the busiest top-of-hour window.
    - cron: "17 8 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/update-profile-stats.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate GitHub statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}
            &show_icons=true
            &include_all_commits=true
            &hide_border=true
            &title_color=FE5F00
            &icon_color=988F2A
            &text_color=E6E1D8
            &bg_color=23231A
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}
            &layout=compact
            &langs_count=8
            &card_width=320
            &size_weight=0.5
            &count_weight=0.5
            &hide_border=true
            &title_color=FE5F00
            &text_color=E6E1D8
            &bg_color=23231A
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: >-
            user=${{ github.repository_owner }}
            &hide_border=true
            &background=23231A
            &ring=FE5F00
            &fire=FE5F00
            &currStreakLabel=988F2A
            &sideLabels=E6E1D8
            &currStreakNum=E6E1D8
            &sideNums=E6E1D8
            &dates=8D897F
            &disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "Stats have not changed."
            exit 0
          fi

          git commit -m "chore: update profile stats"
          git push
